@media (max-width: 359px) {

}

<body><!-- BRA-173：純靜態畫面稿。曲目、封面及紀錄皆為虛構；按鈕不連服務。只有原生 details 可展開。 --><div class="phone"><header class="topbar"><div class="brand">Qualia <em>fm</em></div><span class="edition">把喜歡的留下</span></header><main><header class="heading"><h1>我的歌</h1><p>收藏你的喜歡，釘選下次還想聽的。</p></header><section class="empty"><div class="empty-art" aria-hidden="true"><span class="sleeve"></span><span class="sleeve front"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13M9 8l11-2M6 16a3 2 0 1 0 0 4 3 2 0 1 0 0-4Zm11-2a3 2 0 1 0 0 4 3 2 0 1 0 0-4Z"/></svg></span></div><h2>第一首喜歡，從這裡開始。</h2><p>開一趟電台，聽見喜歡的歌。<br>留下「愛／還行／不對」，<br>它就會出現在這裡。</p><button class="primary" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3Zm-1 0 13-5M7 12h4M7 16h4M16 13a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/></svg>去開台</button></section><p class="empty-foot">收藏、釘選，或當下一趟的種子。<br>慢慢留下屬於你的歌。</p></main><footer class="bottom"><nav aria-label="主要導覽"><button type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3Zm-1 0 13-5M7 12h4M7 16h4M16 13a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/></svg>開台</button><button type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13a8 8 0 0 1 16 0v6M4 13v6M4 13h3v7H4a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2Zm16 0h-3v7h3a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2Z"/></svg>收聽</button><button type="button" aria-current="page"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 5.8a5.4 5.4 0 0 0-7.6 0L12 7l-1.2-1.2a5.4 5.4 0 0 0-7.6 7.6L12 21l8.8-7.6a5.4 5.4 0 0 0 0-7.6Z"/></svg>我的</button><button type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16M8 4v4M16 10v4M10 16v4"/></svg>設定</button></nav></footer></div></body></html>
