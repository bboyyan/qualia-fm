<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRA-170 開台・從一種感覺</title>
<!--
  BRA-170 畫面稿（靜態、離線、單檔）。
  色票／間距／字級逐字抄自 apps/web/src/styles/tokens.css；
  元件樣式對照 ui/ui.module.css（.segmented/.chip/.button.primary）、app/shell.module.css（topbar/nav）、
  features/seed/seed.module.css（hero/card/fieldLabel/seedField/counter/cta/note）。
  新增的只有 .entry*（入口二選一的放大版 segmented）與 .moods（情境標籤 4 欄格），都只用既有 token。
-->
<style>
:root {
  --q-bg: #F6F4ED;
  --q-surface: #FFFEFA;
  --q-subtle: #ECEFE7;
  --q-ink: #1F302A;
  --q-muted: #586A60;
  --q-primary: #294F42;
  --q-on-primary: #FFFFFF;
  --q-accent: #985339;
  --q-border: #CED5CB;
  --q-focus: #1E695E;
  --q-danger: #A63030;
  --q-radius-card: 20px; --q-radius-input: 16px; --q-radius-button: 999px;
  --q-tap: 48px; --q-content-max: 480px;
  --q-font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
  --q-press-motion: 100ms;
  --q-font-display: Georgia, "Times New Roman", "Songti TC", serif;
  --q-ink-strong: #14231D;
  --q-border-strong: #82988B;
  --q-accent-wash: #F3EBDD;
  --q-accent-line: #B79980;
  --q-primary-wash: #E6EBDF;
  --q-shadow-soft: 0 5px 20px rgba(31, 48, 42, 0.035);
  --q-gutter: 20px;
  --q-nav-height: 64px;
  --q-text-h1: 32px; --q-text-body: 16px;
}

/* global.css */
*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: light; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100dvh; background: var(--q-bg); color: var(--q-ink);
  font-family: var(--q-font); font-size: var(--q-text-body); line-height: 1.6;
  -webkit-font-smoothing: antialiased; overflow-wrap: anywhere;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--q-focus); outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: var(--q-text-h1); line-height: 1.25; letter-spacing: -0.03em; font-weight: 650; }
svg { display: block; flex-shrink: 0; }

/* shell.module.css */
.shell { position: relative; width: 100%; max-width: var(--q-content-max); min-height: 100dvh; margin: 0 auto; background: var(--q-bg); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px var(--q-gutter) 8px; }
.brand { font-family: var(--q-font-display); font-size: 30px; line-height: 1.2; letter-spacing: -0.045em; white-space: nowrap; color: var(--q-ink-strong); }
.brand span { font-size: 20px; font-style: italic; letter-spacing: -0.03em; }
.main { padding: 8px var(--q-gutter) calc(var(--q-nav-height) + 40px); }
.bottom {
  position: fixed; z-index: 20; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: var(--q-content-max);
  background: rgba(246, 244, 237, 0.96); backdrop-filter: blur(16px); border-top: 1px solid var(--q-border);
}
.nav { display: grid; grid-template-columns: repeat(4, 1fr); padding: 2px 12px; }
.navButton {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: var(--q-nav-height); border: 0; background: none; color: var(--q-muted); font-size: 13px; border-radius: 14px;
}
.navButton[aria-current='page'] { color: var(--q-primary); font-weight: 650; }
.navButton[aria-current='page']::after {
  content: ''; position: absolute; bottom: 5px; left: 50%; width: 4px; height: 4px;
  border-radius: 50%; background: var(--q-primary); transform: translateX(-50%);
}

/* ui.module.css */
.eyebrow { font-size: 12px; font-weight: 650; letter-spacing: 0.16em; color: var(--q-muted); text-transform: uppercase; }
.button {
  position: relative; display: inline-flex; align-items: center; justify-content: center;
  min-height: 52px; padding: 13px 22px; border-radius: var(--q-radius-button); border: 1px solid transparent;
  font-weight: 600; font-size: 16px; line-height: 1.3; text-align: center;
  transition: transform var(--q-press-motion) ease, background-color 160ms ease;
}
.button:active { transform: scale(0.98); }
.block { display: flex; width: 100%; }
.buttonLabel { display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
.primary { background: var(--q-primary); color: var(--q-on-primary); box-shadow: 0 6px 18px rgba(41, 79, 66, 0.16); min-height: 56px; }
.primary:hover { background: #22453A; }
.chip {
  min-height: var(--q-tap); padding: 10px 15px; border: 1px solid var(--q-border); border-radius: 999px;
  background: transparent; font-size: 14px; line-height: 1.4; color: var(--q-ink);
  transition: background-color 160ms ease, border-color 160ms ease;
}
.chip:hover { background: var(--q-subtle); }
.chip[aria-pressed='true'] { border-color: var(--q-primary); background: var(--q-primary-wash); }

/* seed.module.css */
.hero { padding: 14px 0 22px; }
.hero h1 { margin-top: 12px; }
.hero h1 em { font-style: normal; color: var(--q-accent); }
.hero p:last-child { margin-top: 12px; max-width: 330px; color: var(--q-muted); font-size: 15px; line-height: 1.7; }
.card {
  border: 1px solid var(--q-border); background: var(--q-surface); border-radius: 22px;
  padding: 14px 16px 12px; box-shadow: var(--q-shadow-soft);
}
.fieldLabel { display: block; font-size: 14px; font-weight: 650; margin-bottom: 6px; }
.fieldLabel small { font-weight: 400; color: var(--q-muted); font-size: 13px; }
.seedField {
  display: block; width: 100%; min-height: 44px; resize: none; border: 0; padding: 0;
  background: none; font-size: 18px; line-height: 1.6; outline-offset: 6px; border-radius: 4px;
}
.seedField::placeholder { color: #69786F; }
.counter { display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; font-size: 13px; color: var(--q-muted); }
.cta { margin-top: 20px; }
.ctaNote { margin-top: 10px; text-align: center; font-size: 13px; color: var(--q-muted); }
.note { display: flex; gap: 12px; align-items: flex-start; margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--q-border); }
.noteIcon { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 12px; background: var(--q-subtle); flex-shrink: 0; margin-top: 2px; }
.note strong { display: block; font-size: 14px; font-weight: 650; }
.note p { font-size: 13px; color: var(--q-muted); margin-top: 3px; }

/* ---------- BRA-170 新增：入口二選一（沿用 .segmented 外觀，只放大成兩格） ---------- */
.entry { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--q-subtle); border-radius: 14px; margin-bottom: 16px; }
.entryOption {
  min-height: 52px; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: 0; border-radius: 10px; background: transparent; color: var(--q-muted); font-size: 15px;
  transition: background-color 160ms ease, color 160ms ease;
}
.entryOption[aria-checked='true'] {
  background: var(--q-surface); color: var(--q-ink); font-weight: 650; box-shadow: 0 2px 6px rgba(31, 48, 42, 0.08);
}
.entryOption[aria-checked='true'] svg { color: var(--q-accent); }
.entryOption { white-space: nowrap; }
/* 切到感覺時，歌曲那格仍顯示已勾選幾首：一看就知道切回去清單還在 */
.entryKeep {
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 650; line-height: 1; font-variant-numeric: tabular-nums;
  color: var(--q-primary); background: var(--q-primary-wash); border: 1px solid var(--q-border);
}

/* 情境標籤：沿用 .chip，排成 4 欄讓 8 個標籤剛好兩行、一眼掃完 */
.moodHead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.moodHead .fieldLabel { margin-bottom: 0; }
.moodHint { font-size: 12px; color: var(--q-muted); }
.moods { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 16px; padding: 0; list-style: none; }
.moods .chip { width: 100%; padding: 10px 4px; text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.moods .chip[aria-pressed='true'] { color: var(--q-primary); font-weight: 650; }
.custom { border-top: 1px solid var(--q-border); padding-top: 12px; }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <p class="brand" aria-label="Qualia FM">Qualia <span>fm</span></p>
  </header>

  <main class="main">
    <section class="hero" aria-labelledby="home-title">
      <p class="eyebrow">YOUR FEELING, ON AIR.</p>
      <h1 id="home-title">不是同類型。<br>是<em>同一種感覺。</em></h1>
      <p>給我一首歌，或此刻的心情。<br>讓下一首，接住你想留下的感覺。</p>
    </section>

    <form class="composer" onsubmit="return false" novalidate>
      <section class="card" aria-label="電台起點">
        <!-- 取代原本 感覺／歌曲／聲音 三格；拿掉聲音，兩格寫成完整動作句 -->
        <div class="entry" role="radiogroup" aria-label="從哪裡開始">
          <button type="button" class="entryOption" role="radio" aria-checked="false">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13M9 8l11-2M6 16a3 2 0 1 0 0 4 3 2 0 1 0 0-4Zm11-2a3 2 0 1 0 0 4 3 2 0 1 0 0-4Z"/></svg>
            從一首歌 <span class="entryKeep" aria-label="已選 1 首">1</span>
          </button>
          <button type="button" class="entryOption" role="radio" aria-checked="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 6.4L21 12l-6.4 2.6L12 21l-2.6-6.4L3 12l6.4-2.6L12 3Z"/></svg>
            從一種感覺
          </button>
        </div>

        <div class="moodHead">
          <span class="fieldLabel" id="mood-label">此刻是哪一種？</span>
          <span class="moodHint">點一個就能開台</span>
        </div>
        <ul class="moods" role="group" aria-labelledby="mood-label">
          <li><button type="button" class="chip" aria-pressed="false">平靜</button></li>
          <li><button type="button" class="chip" aria-pressed="false">振奮</button></li>
          <li><button type="button" class="chip" aria-pressed="false">健身</button></li>
          <li><button type="button" class="chip" aria-pressed="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4L19 6"/></svg>失戀</button></li>
          <li><button type="button" class="chip" aria-pressed="false">深夜</button></li>
          <li><button type="button" class="chip" aria-pressed="false">通勤</button></li>
          <li><button type="button" class="chip" aria-pressed="false">專注</button></li>
          <li><button type="button" class="chip" aria-pressed="false">雨天</button></li>
        </ul>

        <div class="custom">
          <label class="fieldLabel" for="feel-text">再補一句 <small>（選填，也可以只寫這句）</small></label>
          <textarea id="feel-text" class="seedField" rows="1" placeholder="例如：想在夜裡慢慢放鬆。">下班一個人走回家，不想太悲傷。</textarea>
          <div class="counter">
            <span>不需要懂樂理，照你的感覺說。</span>
            <span>15 / 500</span>
          </div>
        </div>
      </section>

      <div class="cta">
        <button type="submit" class="button primary block">
          <span class="buttonLabel">從「失戀」開台
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>
          </span>
        </button>
        <p class="ctaNote">5 首歌，一段有理由的相遇。</p>
      </div>
    </form>

    <div class="note">
      <span class="noteIcon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 3C8 2 2 8 6 16c8 4 14-2 14-13ZM5 20l10-11"/></svg></span>
      <div>
        <strong>不只推薦，也告訴你為什麼。</strong>
        <p>跨過曲風，用空間感、音色與情緒連起下一首。</p>
      </div>
    </div>
  </main>

  <div class="bottom">
    <nav class="nav" aria-label="主要導覽">
      <button type="button" class="navButton" aria-current="page">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3Zm-1 0 13-5M7 12h4M7 16h4M16 13a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/></svg>
        <span>開台</span>
      </button>
      <button type="button" class="navButton">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13a8 8 0 0 1 16 0v6M4 13v6M4 13h3v7H4a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2Zm16 0h-3v7h3a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2Z"/></svg>
        <span>收聽</span>
      </button>
      <button type="button" class="navButton">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 5.8a5.4 5.4 0 0 0-7.6 0L12 7l-1.2-1.2a5.4 5.4 0 0 0-7.6 7.6L12 21l8.8-7.6a5.4 5.4 0 0 0 0-7.6Z"/></svg>
        <span>我的</span>
      </button>
      <button type="button" class="navButton">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16M8 4v4M16 10v4M10 16v4"/></svg>
        <span>設定</span>
      </button>
    </nav>
  </div>
</div>
</body>
</html>
