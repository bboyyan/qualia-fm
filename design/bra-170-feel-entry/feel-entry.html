<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRA-170 開台入口 v3</title>
<!--
  BRA-170 畫面稿 v3（靜態、離線、單檔；v2 照曄 H1 回覆，v3 照曄對 v2 回覆：Hero 只留一個主標）。
  色票／間距／字級逐字抄自 apps/web/src/styles/tokens.css；
  元件樣式對照 ui/ui.module.css（.segmented/.chip/.button.primary/.outline）、app/shell.module.css（topbar/nav）、
  features/seed/seed.module.css（hero/card/fieldLabel/seedField/counter/chips/cta/note/pick*）。
  新增只有 .entry*、.moods、.examplesHead、.preview*，都只用既有 token。
  用 URL hash 切狀態：#song（預設）、#feel、#feel-empty、#feel-text、#feel-chip；後綴 -next＝已有節目在播，-full＝整頁截圖用。
-->
<style>
:root {
  --q-bg: #F6F4ED;
  --q-surface: #FFFEFA;
  --q-subtle: #ECEFE7;
  --q-ink: #1F302A;
  --q-muted: #586A60;
  --q-primary: #294F42;
  --q-on-primary: #FFFFFF;
  --q-accent: #985339;
  --q-border: #CED5CB;
  --q-focus: #1E695E;
  --q-danger: #A63030;
  --q-radius-card: 20px; --q-radius-input: 16px; --q-radius-button: 999px;
  --q-tap: 48px; --q-content-max: 480px;
  --q-font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
  --q-press-motion: 100ms;
  --q-font-display: Georgia, "Times New Roman", "Songti TC", serif;
  --q-ink-strong: #14231D;
  --q-border-strong: #82988B;
  --q-accent-wash: #F3EBDD;
  --q-accent-line: #B79980;
  --q-primary-wash: #E6EBDF;
  --q-shadow-soft: 0 5px 20px rgba(31, 48, 42, 0.035);
  --q-gutter: 20px;
  --q-nav-height: 64px;
  --q-text-h1: 32px; --q-text-body: 16px;
}

/* global.css */
*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: light; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100dvh; background: var(--q-bg); color: var(--q-ink);
  font-family: var(--q-font); font-size: var(--q-text-body); line-height: 1.6;
  -webkit-font-smoothing: antialiased; overflow-wrap: anywhere;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--q-focus); outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: var(--q-text-h1); line-height: 1.25; letter-spacing: -0.03em; font-weight: 650; }
svg { display: block; flex-shrink: 0; }

/* shell.module.css */
.shell { position: relative; width: 100%; max-width: var(--q-content-max); min-height: 100dvh; margin: 0 auto; background: var(--q-bg); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px var(--q-gutter) 8px; }
.brand { font-family: var(--q-font-display); font-size: 30px; line-height: 1.2; letter-spacing: -0.045em; white-space: nowrap; color: var(--q-ink-strong); }
.brand span { font-size: 20px; font-style: italic; letter-spacing: -0.03em; }
.main { padding: 8px var(--q-gutter) calc(var(--q-nav-height) + 40px); }
.bottom {
  position: fixed; z-index: 20; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: var(--q-content-max);
  background: rgba(246, 244, 237, 0.96); backdrop-filter: blur(16px); border-top: 1px solid var(--q-border);
}
.nav { display: grid; grid-template-columns: repeat(4, 1fr); padding: 2px 12px; }
.navButton {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: var(--q-nav-height); border: 0; background: none; color: var(--q-muted); font-size: 13px; border-radius: 14px;
}
.navButton[aria-current='page'] { color: var(--q-primary); font-weight: 650; }
.navButton[aria-current='page']::after {
  content: ''; position: absolute; bottom: 5px; left: 50%; width: 4px; height: 4px;
  border-radius: 50%; background: var(--q-primary); transform: translateX(-50%);
}

/* ui.module.css */
.eyebrow { font-size: 12px; font-weight: 650; letter-spacing: 0.16em; color: var(--q-muted); text-transform: uppercase; }
.button {
  position: relative; display: inline-flex; align-items: center; justify-content: center;
  min-height: 52px; padding: 13px 22px; border-radius: var(--q-radius-button); border: 1px solid transparent;
  font-weight: 600; font-size: 16px; line-height: 1.3; text-align: center;
  transition: transform var(--q-press-motion) ease, background-color 160ms ease;
}
.button:active { transform: scale(0.98); }
.block { display: flex; width: 100%; }
.buttonLabel { display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
.primary { background: var(--q-primary); color: var(--q-on-primary); box-shadow: 0 6px 18px rgba(41, 79, 66, 0.16); min-height: 56px; }
.primary:hover { background: #22453A; }
.chip {
  min-height: var(--q-tap); padding: 10px 15px; border: 1px solid var(--q-border); border-radius: 999px;
  background: transparent; font-size: 14px; line-height: 1.4; color: var(--q-ink);
  transition: background-color 160ms ease, border-color 160ms ease;
}
.chip:hover { background: var(--q-subtle); }
.chip[aria-pressed='true'] { border-color: var(--q-primary); background: var(--q-primary-wash); }

/* seed.module.css */
.hero { padding: 14px 0 22px; }
.hero h1 em { font-style: normal; color: var(--q-accent); }
/* v3：拿掉 Eyebrow 與舊 h1，引言升為主標。26px 讓 13 字的第二行在 390 寬（內容 350px）剛好一行 */
.heroTitle { font-size: 26px; line-height: 1.45; letter-spacing: -0.02em; font-weight: 650; color: var(--q-ink-strong); }
.card {
  border: 1px solid var(--q-border); background: var(--q-surface); border-radius: 22px;
  padding: 14px 16px 12px; box-shadow: var(--q-shadow-soft);
}
.fieldLabel { display: block; font-size: 14px; font-weight: 650; margin-bottom: 6px; }
.fieldLabel small { font-weight: 400; color: var(--q-muted); font-size: 13px; }
.seedField {
  display: block; width: 100%; min-height: 44px; resize: none; border: 0; padding: 0;
  background: none; font-size: 18px; line-height: 1.6; outline-offset: 6px; border-radius: 4px;
}
.seedField::placeholder { color: #69786F; }
.counter { display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; font-size: 13px; color: var(--q-muted); }
.cta { margin-top: 20px; }
.ctaNote { margin-top: 10px; text-align: center; font-size: 13px; color: var(--q-muted); }
.note { display: flex; gap: 12px; align-items: flex-start; margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--q-border); }
.noteIcon { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 12px; background: var(--q-subtle); flex-shrink: 0; margin-top: 2px; }
.note strong { display: block; font-size: 14px; font-weight: 650; }
.note p { font-size: 13px; color: var(--q-muted); margin-top: 3px; }

.button:disabled { opacity: 0.5; cursor: default; }
.button:disabled:active { transform: none; }
.outline { background: transparent; border-color: var(--q-border-strong); color: var(--q-ink); font-weight: 550; min-height: 48px; }
.outline:hover:not(:disabled) { background: var(--q-subtle); }

/* seed.module.css：種子清單（BRA-117／156，原樣沿用） */
.pickList { margin: 0 0 4px; }
.pickHead { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.pickHead h2 { font-size: 14px; font-weight: 650; letter-spacing: 0.02em; }
.pickCount { margin-left: auto; font-size: 12px; color: var(--q-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pickAll {
  min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--q-border-strong);
  background: var(--q-surface); color: var(--q-ink); font-size: 13px; font-weight: 650; white-space: nowrap;
}
.pickAll[aria-pressed='true'] { background: var(--q-primary-wash); border-color: var(--q-primary); color: var(--q-primary); }
.pickList ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.pickRow { position: relative; display: flex; align-items: flex-start; gap: 8px; padding: 12px 12px 12px 14px; border: 1px solid var(--q-border); border-radius: 14px; background: var(--q-surface); }
.pickRowOn { border-color: var(--q-primary); background: var(--q-primary-wash); }
.pickRow label { flex: 1; min-width: 0; display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.pickRow input[type='checkbox'] { flex-shrink: 0; width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--q-primary); }
.pickText { display: grid; gap: 2px; min-width: 0; }
.pickText strong { font-family: var(--q-font-display); font-size: 17px; line-height: 1.35; font-weight: 600; }
.pickTag { justify-self: start; margin-bottom: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 650; letter-spacing: 0.04em; color: var(--q-accent); background: var(--q-accent-wash); border: 1px solid var(--q-accent-line); }
.pickMeta { font-size: 13px; color: var(--q-ink); }
.pickNote { font-size: 12px; line-height: 1.55; color: var(--q-muted); }
.seedHint { margin: 6px 2px 14px; font-size: 12px; line-height: 1.6; color: var(--q-muted); }
.artistField {
  width: 100%; min-height: var(--q-tap); margin-bottom: 4px; padding: 11px 12px;
  border: 1px solid var(--q-border-strong); border-radius: 12px; background: var(--q-surface); font-size: 16px;
}
.artistField::placeholder { color: #69786F; }
.card > .outline { margin-top: 10px; }

/* ---------- BRA-170 v2：入口二選一（沿用 .segmented 外觀，兩格、無徽章） ---------- */
.entry { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--q-subtle); border-radius: 14px; margin-bottom: 16px; }
.entryOption {
  min-height: 52px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap;
  border: 0; border-radius: 10px; background: transparent; color: var(--q-muted); font-size: 15px;
  transition: background-color 160ms ease, color 160ms ease;
}
.entryOption[aria-checked='true'] { background: var(--q-surface); color: var(--q-ink); font-weight: 650; box-shadow: 0 2px 6px rgba(31, 48, 42, 0.08); }
.entryOption[aria-checked='true'] svg { color: var(--q-accent); }

/* 情境標籤（場景／類別，單選）：沿用 .chip，4 欄 × 2 行 */
.moodHead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.moodHead .fieldLabel { margin-bottom: 0; }
.moodHint { font-size: 12px; color: var(--q-muted); }
.moods { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 16px; padding: 0; list-style: none; }
.moods .chip { width: 100%; padding: 10px 4px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.moods .chip[aria-pressed='true'] { color: var(--q-primary); font-weight: 650; }
.custom { border-top: 1px solid var(--q-border); padding-top: 12px; }

/* 範例 chips（常用的一句感受，只填入「再補一句」）：沿用 .chips/.chip，加一行小標 */
.examples { margin-top: 14px; }
.examplesHead { display: block; margin: 0 2px 8px; font-size: 12px; color: var(--q-muted); }
.examplesHead strong { color: var(--q-ink); font-weight: 650; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

/* 完整組句預覽：沿用生成畫面 .seedQuote 的左線樣式，但不截斷 */
.preview { margin-top: 18px; }
.previewLabel { font-size: 12px; font-weight: 650; letter-spacing: 0.04em; color: var(--q-muted); }
.previewQuote {
  margin-top: 6px; padding-left: 14px; border-left: 2px solid var(--q-accent-line);
  color: var(--q-ink); font-size: 16px; line-height: 1.7; white-space: pre-line;
}
.previewEmpty .previewQuote { color: var(--q-muted); border-left-color: var(--q-border); font-size: 14px; }
.cta { margin-top: 18px; }

/* 狀態切換：body[data-entry] 決定顯示哪一組 */
body[data-entry='song'] .feelOnly, body[data-entry='feel'] .songOnly { display: none; }
/* 只給 full-page 截圖用（hash 加 -full）：導覽列貼在頁尾，不浮在中間 */
.fullpage .bottom { position: absolute; }
</style>
</head>
<body data-entry="song">
<div class="shell">
  <header class="topbar">
    <p class="brand" aria-label="Qualia FM">Qualia <span>fm</span></p>
  </header>

  <main class="main">
    <section class="hero" aria-labelledby="home-title">
      <h1 id="home-title" class="heroTitle">從<em>一首歌</em>，或<em>一種感覺</em>，<br>開始探索你的人生終極曲目。</h1>
    </section>

    <form class="composer" onsubmit="return false" novalidate>
      <section class="card" aria-label="電台起點">
        <!-- 兩格入口；v2 拿掉「從一首歌」的數量徽章 -->
        <div class="entry" role="radiogroup" aria-label="從哪裡開始">
          <button type="button" class="entryOption" role="radio" data-entry="song" aria-checked="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13M9 8l11-2M6 16a3 2 0 1 0 0 4 3 2 0 1 0 0-4Zm11-2a3 2 0 1 0 0 4 3 2 0 1 0 0-4Z"/></svg>
            從一首歌
          </button>
          <button type="button" class="entryOption" role="radio" data-entry="feel" aria-checked="false">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 6.4L21 12l-6.4 2.6L12 21l-2.6-6.4L3 12l6.4-2.6L12 3Z"/></svg>
            從一種感覺
          </button>
        </div>

        <!-- 從一首歌：與 BRA-117／156 現況相同 -->
        <div class="songOnly">
          <div class="pickList" role="group" aria-labelledby="seed-list-label">
            <div class="pickHead">
              <h2 id="seed-list-label">種子清單</h2>
              <span class="pickCount">已選 1／1</span>
              <button type="button" class="pickAll" aria-pressed="true">取消全選</button>
            </div>
            <ul>
              <li class="pickRow pickRowOn">
                <label>
                  <input type="checkbox" checked>
                  <span class="pickText">
                    <span class="pickTag">預設種子・可更換</span>
                    <strong>Time Flows Ever Onward</strong>
                    <span class="pickMeta">Evan Call</span>
                    <span class="pickNote">《葬送的芙莉蓮》原聲帶版</span>
                  </span>
                </label>
              </li>
            </ul>
          </div>
          <p class="seedHint">只把種子當起點，不從它推測你其他的喜好。取消勾選、加入別首，就能更換。</p>
          <label class="fieldLabel" for="song-title">想換或多加一首？（歌名）</label>
          <textarea id="song-title" class="seedField" rows="1" placeholder="輸入歌名"></textarea>
          <label class="fieldLabel" for="song-artist">藝人（選填）</label>
          <input id="song-artist" class="artistField" placeholder="避免找成同名的另一首歌">
        </div>
        <button type="button" class="button outline block songOnly" disabled>
          <span class="buttonLabel">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13M9 8l11-2M6 16a3 2 0 1 0 0 4 3 2 0 1 0 0-4Zm11-2a3 2 0 1 0 0 4 3 2 0 1 0 0-4Z"/></svg>
            加入清單並勾選
          </span>
        </button>

        <!-- 從一種感覺：情境標籤（單選）＋再補一句 -->
        <div class="feelOnly">
          <div class="moodHead">
            <span class="fieldLabel" id="mood-label">此刻是哪一種？</span>
            <span class="moodHint">選一個，再點一次取消</span>
          </div>
          <ul class="moods" role="group" aria-labelledby="mood-label" id="moods"></ul>

          <div class="custom">
            <label class="fieldLabel" for="feel-text">再補一句 <small>（選填，也可以只寫這句）</small></label>
            <textarea id="feel-text" class="seedField" rows="1" placeholder="例如：下班一個人走回家。" aria-describedby="feel-help"></textarea>
            <div class="counter">
              <span id="feel-help">不需要懂樂理，照你的感覺說。</span>
              <span id="feel-count" aria-live="polite">0 / 500</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 範例 chips：兩種模式都在卡片下方；只會填入「再補一句」，不會開始 -->
      <div class="examples" role="group" aria-labelledby="examples-label">
        <span class="examplesHead" id="examples-label"><strong>常用的一句感受</strong><span class="songOnly">・點了會切到「從一種感覺」</span><span class="feelOnly">・點了填入「再補一句」</span></span>
        <div class="chips" id="examples"></div>
      </div>

      <!-- 完整組句預覽：就是送出的 seed.text 原文，可換行、不截斷 -->
      <div class="preview feelOnly" id="preview" aria-live="polite">
        <p class="previewLabel">這次開台會用</p>
        <p class="previewQuote" id="preview-text"></p>
      </div>

      <div class="cta">
        <button type="submit" class="button primary block" id="go">
          <span class="buttonLabel"><span id="go-label">全選・快速開台</span>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>
          </span>
        </button>
        <p class="ctaNote">5 首歌，一段有理由的相遇。</p>
      </div>
    </form>

    <div class="note">
      <span class="noteIcon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 3C8 2 2 8 6 16c8 4 14-2 14-13ZM5 20l10-11"/></svg></span>
      <div>
        <strong>不只推薦，也告訴你為什麼。</strong>
        <p>跨過曲風，用空間感、音色與情緒連起下一首。</p>
      </div>
    </div>
  </main>

  <div class="bottom">
    <nav class="nav" aria-label="主要導覽">
      <button type="button" class="navButton" aria-current="page">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3Zm-1 0 13-5M7 12h4M7 16h4M16 13a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/></svg>
        <span>開台</span>
      </button>
      <button type="button" class="navButton">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13a8 8 0 0 1 16 0v6M4 13v6M4 13h3v7H4a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2Zm16 0h-3v7h3a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2Z"/></svg>
        <span>收聽</span>
      </button>
      <button type="button" class="navButton">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 5.8a5.4 5.4 0 0 0-7.6 0L12 7l-1.2-1.2a5.4 5.4 0 0 0-7.6 7.6L12 21l8.8-7.6a5.4 5.4 0 0 0 0-7.6Z"/></svg>
        <span>我的</span>
      </button>
      <button type="button" class="navButton">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16M8 4v4M16 10v4M10 16v4"/></svg>
        <span>設定</span>
      </button>
    </nav>
  </div>
</div>
<script>
/* 畫面稿互動（只為示意與截圖，不是產品碼）。 */
const MOOD_PRESETS = [
  { id: 'calm', label: '平靜', prompt: '平靜下來的心情：放慢呼吸，柔和、多一點留白' },
  { id: 'uplift', label: '振奮', prompt: '想被振奮：明亮、有推進感，讓人想動起來' },
  { id: 'workout', label: '健身', prompt: '運動時穩定推進的節奏與能量' },
  { id: 'heartbreak', label: '失戀', prompt: '失戀後的心情：有點空、溫柔，慢慢走出來' },
  { id: 'late-night', label: '深夜', prompt: '深夜獨處：安靜、貼近耳邊，不吵醒誰' },
  { id: 'commute', label: '通勤', prompt: '通勤路上：順順地往前走，不打擾思緒' },
  { id: 'focus', label: '專注', prompt: '需要專注：穩定、少人聲，不搶注意力' },
  { id: 'rainy', label: '雨天', prompt: '雨天的氣氛：潮濕、慵懶，帶一點溫度' },
];
const EXAMPLES = ['夜裡慢慢放鬆', '想找回一點精神', '陪我安靜走一段'];
const MAX = 500;
const CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4L19 6"/></svg>';

const SCENES = {
  song: { entry: 'song', mood: null, text: '' },
  feel: { entry: 'feel', mood: 'heartbreak', text: '下班一個人走回家' },
  'feel-empty': { entry: 'feel', mood: null, text: '' },
  'feel-text': { entry: 'feel', mood: null, text: '下班一個人走回家' },
  'feel-chip': { entry: 'feel', mood: 'late-night', text: '夜裡慢慢放鬆' },
};
const hash = location.hash.slice(1);
const full = hash.endsWith('-full');
const base = hash.replace(/-full$/, '');
const continuing = base.endsWith('-next');
const scene = base.replace(/-next$/, '');
if (full) document.documentElement.classList.add('fullpage');
const state = { ...(SCENES[scene] ?? SCENES.song) };

const $ = (id) => document.getElementById(id);
const moodOf = (id) => MOOD_PRESETS.find((m) => m.id === id) ?? null;

/** 組 seed.text：標籤 prompt 在前、自訂句在後，用「。」接起來。 */
function composeSeedText(mood, text) {
  const own = text.trim();
  if (!mood) return own;
  return own ? `${mood.prompt}。${own}` : mood.prompt;
}

function goLabel(mood) {
  if (mood) return `從「${mood.label}」${continuing ? '建立下一段' : '開台'}`;
  return continuing ? '建立下一段' : '為我開台';
}

function render() {
  document.body.dataset.entry = state.entry;
  document.querySelectorAll('.entryOption').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.entry === state.entry)));
  $('moods').innerHTML = MOOD_PRESETS.map((m) => {
    const on = state.mood === m.id;
    return `<li><button type="button" class="chip" data-mood="${m.id}" aria-pressed="${on}">${on ? CHECK : ''}${m.label}</button></li>`;
  }).join('');
  $('examples').innerHTML = EXAMPLES.map((e) => {
    const on = state.entry === 'feel' && state.text === e;
    return `<button type="button" class="chip" data-example="${e}" aria-pressed="${on}">${e}</button>`;
  }).join('');
  if ($('feel-text').value !== state.text) $('feel-text').value = state.text;

  const mood = moodOf(state.mood);
  const seed = composeSeedText(mood, state.text);
  const count = [...seed].length;
  $('feel-count').textContent = `${count} / ${MAX}`;
  const go = $('go');
  if (state.entry === 'song') {
    $('go-label').textContent = continuing ? '全選・建立下一段' : '全選・快速開台';
    go.disabled = false;
    return;
  }
  const empty = seed.length === 0;
  $('preview').classList.toggle('previewEmpty', empty);
  $('preview-text').textContent = empty ? '先選一個感覺，或寫一句。這裡會顯示這次開台用的完整句子。' : seed;
  $('go-label').textContent = goLabel(mood);
  go.disabled = empty || count > MAX;
}

document.addEventListener('click', (event) => {
  const t = event.target.closest('button');
  if (!t) return;
  if (t.dataset.entry) state.entry = t.dataset.entry;
  else if (t.dataset.mood) state.mood = state.mood === t.dataset.mood ? null : t.dataset.mood;
  else if (t.dataset.example) {
    const e = t.dataset.example;
    if (state.entry === 'feel' && state.text === e) state.text = '';
    else { state.entry = 'feel'; state.text = e; }
  } else return;
  render();
});
$('feel-text').addEventListener('input', (event) => { state.text = event.target.value; render(); });

render();
if (scene === 'feel' || scene === 'feel-text' || scene === 'feel-chip') {
  // 模擬使用者選完、寫完後往下捲：卡片頂到上緣，主按鈕留在首屏
  const card = document.querySelector('.card');
  window.scrollTo(0, card.getBoundingClientRect().top + window.scrollY - 12);
}
</script>
</body>
</html>
