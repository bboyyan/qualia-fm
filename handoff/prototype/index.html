function settings(){return `<div class="settings-heading"><div class="eyebrow">MAKE IT YOURS</div><h1 style="margin-top:10px">剛剛好的陪伴。</h1></div><div class="settings-group"><div class="settings-row"><div><h3>讓 DJ 說一點話</h3><p>新片段播放前，用一句話接住感覺。</p></div><button role="switch" class="switch" data-action="dj" aria-checked="${state.dj}" aria-label="DJ 介紹"><span class="switch-track"><span class="switch-knob"></span></span></button></div><div class="settings-row"><div><h3>串詞長度</h3><p>${state.length==='short'?'短版：少說一點，留更多空間。':'標準：多一點關聯說明，不超過 80 字。'}</p></div><button class="outline" style="font-size:13px;min-width:68px" data-action="length">${state.length==='short'?'短版':'標準'}</button></div></div><div class="settings-section-label">播放環境</div><div class="settings-group"><div class="settings-row"><div><h3>示範模式</h3><p>未連接 Spotify，所有曲目皆為虛構。</p></div><span class="count-pill">DEMO</span></div><div class="settings-row"><div><h3>Spotify 尚未啟用</h3><p>需先核對政策、帳號權限與手機播放。不是登入失敗。</p></div></div></div><div class="settings-info"><h3>關於聲音與資料</h3><p>這份原型不發出聲音、不登入、不呼叫 API，也不儲存你的輸入。正式版語音需標示為 AI 生成；音量使用手機音量鍵控制。</p></div><div class="settings-section-label">原型情境預覽 · 不代表真實故障</div><div class="button-stack"><button class="outline" data-action="simulate" data-error="gesture">查看「點一下繼續」狀態</button><button class="outline" data-action="simulate" data-error="offline">查看「連線中斷」狀態</button><button class="text-button" data-action="reset">重設這份示意原型</button></div>`}
function render(scroll=false){app.className='shell'+(state.hasShow&&state.tab!=='listen'?' with-mini':'');document.body.classList.toggle('with-mini',state.hasShow&&state.tab!=='listen');const content=state.tab==='home'?home():state.tab==='listen'?listen():settings();app.innerHTML=topbar()+`<main id="main-content" class="fade-in">${content}</main>`+footer();if(scroll)window.scrollTo({top:0,behavior:'instant'});bindFields();}
function bindFields(){const input=document.getElementById('seed');if(input)input.addEventListener('input',e=>{state.seed=e.target.value;const count=gc(state.seed);document.getElementById('count').textContent=`${count} / 500`;document.getElementById('generate').disabled=!state.seed.trim()||count>500;document.getElementById('seed-error').textContent=count>500?'請縮短至 500 字元以內，輸入已保留。':''});const artist=document.getElementById('artist');if(artist)artist.addEventListener('input',e=>state.artist=e.target.value)}
function stopTimer(){clearInterval(playbackTimer);playbackTimer=null}
function startTimer(){stopTimer();if(!state.playing)return;playbackTimer=setInterval(()=>{if(!state.playing)return;if(state.phase==='intro'){state.introPosition++;if(state.introPosition>=5){state.phase='track';state.introPosition=0;announce('介紹示意結束，進入同一首曲目');render()}return;}if(state.phase!=='track')return;state.position++;if(state.position>=current().duration){if(state.index<state.queue.length-1)nextTrack();else{state.playing=false;state.phase='finished';stopTimer();announce('這一段示意節目已結束');render()}}else{const elapsed=document.getElementById('elapsed'),bar=document.getElementById('progress-fill');if(elapsed)elapsed.textContent=time(state.position);if(bar)bar.style.width=`${state.position/current().duration*100}%`}},1000)}
function playCurrent(withIntro=true){state.error=null;state.position=0;state.introPosition=0;state.phase=withIntro&&state.dj?'intro':'track';state.playing=true;startTimer();announce(`示意播放：${current().title}`);render()}
function toggle(){if(!state.hasShow)return;if(state.error){state.error=null;}if(state.phase==='ready'||state.phase==='finished'){playCurrent(state.phase!=='finished');return;}state.playing=!state.playing;state.playing?startTimer():stopTimer();announce(state.playing?'開始示意播放，沒有音訊':'已暫停示意播放');render()}
function nextTrack(){if(state.index>=state.queue.length-1)return;state.index++;playCurrent(true)}
function startGeneration(){if(!state.seed.trim()||gc(state.seed)>500)return;const id=++state.generation;state.stage=0;state.page='generating';render(true);announce('模擬生成開始');clearInterval(generationTimer);generationTimer=setInterval(()=>{if(state.generation!==id){clearInterval(generationTimer);return;}state.stage++;if(state.stage>=4){clearInterval(generationTimer);state.page='ready';render(true);announce('示意節目準備好了，尚未播放')}else{render();announce(['理解你的感覺','配對相近的聲景','確認候選曲目','準備這一段節目'][state.stage])}},550)}
function cancelGeneration(){state.generation++;clearInterval(generationTimer);state.page='idle';render(true);announce('已取消，輸入保留')}
function openSheet(type,push=true){if(!state.hasShow)return;returnFocus=document.activeElement;state.sheet=type;const title={bridge:'為什麼是這首',queue:'這一段的節目單',tune:'把接下來，調近一點'}[type];document.getElementById('sheet-title').textContent=title;sheet.querySelector('[data-action="close-sheet"]').innerHTML=icon('close');drawSheet();if(!sheet.open){sheet.showModal();document.body.style.overflow='hidden';if(push)history.pushState({qualiaSheet:type},'',`#${type}`)}sheet.querySelector('[data-action="close-sheet"]').focus()}
function drawSheet(){const s=current();if(state.sheet==='bridge'){sheetBody.innerHTML=`<p class="sheet-lead">${esc(s.title)} · 虛構示意曲目<br>讓推薦有一個聽得懂的理由。</p><div class="quote-panel"><div class="eyebrow">THE BRIDGE / 與起點的連結</div><p>${esc(s.seedBridge.replace('示意：',''))}</p></div><div class="vibes">${s.vibe.map(v=>`<span class="vibe">${esc(v)}</span>`).join('')}</div><div class="detail-grid"><div class="detail-cell"><span>空間感</span><p>貼近，卻留有呼吸。</p></div><div class="detail-cell"><span>情緒速度</span><p>緩緩前進，不催促。</p></div><div class="detail-cell"><span>音色</span><p>柔和低頻、輕薄聲景。</p></div><div class="detail-cell"><span>歌詞情境</span><p>尚無資料，不做推測。</p></div></div><button class="outline" data-action="replay-intro" style="width:100%">${icon('sound')}重看介紹流程 · 無音訊</button><p class="disclaimer">可信度：介面示意。此處所有聲景描述與曲目均為虛構，沒有聽音驗證。正式版必須標示推薦依據與不確定性；找到歌曲不代表已分析歌曲。</p>`}else if(state.sheet==='queue'){sheetBody.innerHTML=`<p class="sheet-lead">${state.queue.length} 首示意曲目。查看清單不會中斷播放。<br>想跳到某首，請按「現在播放」。</p>${state.queue.map((id,i)=>{const t=songs[id];return `<div class="queue-row ${i===state.index?'current':''}" data-queue-id="${id}"><div class="queue-index">${String(i+1).padStart(2,'0')}</div><div class="queue-data"><h3>${esc(t.title)}</h3><p>${esc(t.seedBridge.replace('示意：',''))}</p></div><div class="queue-actions">${i===state.index?'<span class="queue-status">目前曲目</span>':`<button class="queue-play" data-action="jump" data-index="${i}" aria-label="現在播放 ${esc(t.title)}">現在播放</button>${i>state.index?`<button data-action="remove" data-index="${i}" aria-label="移除 ${esc(t.title)}">移除</button>`:'<span class="small-caption">已播過</span>'}`}</div></div>`}).join('')}<p class="disclaimer">移除只影響接下來的曲目，當前曲目不會被刪除。原型沒有真實播放或持久儲存。</p>`}else{sheetBody.innerHTML=`<p class="sheet-lead">只調整接下來，<strong>不打斷這首</strong>。<br>保留喜歡的部分，把距離再拉近一點。</p><div class="tune-grid">${['更放鬆','更有推進','多點人聲','更陌生'].map(v=>`<button class="tune-option" data-action="tune-option" data-value="${v}" aria-pressed="${state.tune===v}">${v}</button>`).join('')}</div><label class="field-label" for="tune-text">也可以直接告訴 DJ</label><textarea id="tune-text" class="tune-field" placeholder="例如：節奏保留，但聲音再柔一點。" maxlength="500">${esc(state.tune)}</textarea><button class="primary" data-action="apply-tune" id="apply-tune" ${!state.tune.trim()?'disabled':''}>套用到接下來${icon('arrow')}</button><p class="disclaimer">此原型只示範選取與確認；套用後交換未播曲目的順序，不會呼叫 AI 重新選歌。正式版必須等待新節目尾段準備好才替換。</p>`;sheetBody.querySelector('#tune-text').addEventListener('input',e=>{state.tune=e.target.value;sheetBody.querySelector('#apply-tune').disabled=!state.tune.trim()})}}
function closeSheet(back=true){if(!sheet.open)return;sheet.close();document.body.style.overflow='';state.sheet=null;if(back&&history.state?.qualiaSheet)history.back();const target=returnFocus;requestAnimationFrame(()=>{if(target?.isConnected)target.focus();else app.querySelector('[data-action="'+(history.state?.qualiaSheet||'queue')+'"]')?.focus()})}
sheet.addEventListener('cancel',e=>{e.preventDefault();closeSheet()});
sheet.addEventListener('click',e=>{if(e.target===sheet){const b=sheet.getBoundingClientRect();if(e.clientY<b.top||e.clientX<b.left||e.clientX>b.right)closeSheet()}});
window.addEventListener('popstate',()=>{if(sheet.open&&!history.state?.qualiaSheet)closeSheet(false)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;
 if(a==='tab'){state.tab=b.dataset.tab;render(true);return}
 if(a==='mode'){state.mode=b.dataset.mode;render();return}
 if(a==='example'){state.mode='feeling';state.seed=b.dataset.value;render();return}
 if(a==='generate'){startGeneration();return}
 if(a==='cancel-generation'){cancelGeneration();return}
 if(a==='edit-seed'){state.page='idle';render(true);return}
 if(a==='start-show'){state.hasShow=true;state.showSeed=state.seed;state.queue=[0,1,2,3,4];state.index=0;state.tab='listen';state.page='idle';playCurrent(true);window.scrollTo({top:0,behavior:'instant'});return}
 if(a==='toggle'){toggle();return}
 if(a==='next'){nextTrack();return}
 if(a==='restart'){state.position=0;state.phase='track';state.introPosition=0;state.playing=true;startTimer();render();announce('重播本曲示意，不重念介紹');return}
 if(a==='skip-intro'){state.phase='track';state.introPosition=0;render();announce('已略過介紹，保留同一首曲目');return}
 if(a==='like'){const id=current().id;state.liked.has(id)?state.liked.delete(id):state.liked.add(id);render();showToast(state.liked.has(id)?'已記下這次示意喜好，不會儲存或送出。':'已取消示意喜好。');return}
 if(['bridge','queue','tune'].includes(a)){openSheet(a);return}
 if(a==='close-sheet'){closeSheet();return}
 if(a==='jump'){state.index=Number(b.dataset.index);closeSheet();playCurrent(true);return}
 if(a==='remove'){const i=Number(b.dataset.index);if(i<=state.index)return;state.removed={id:state.queue[i],index:i};state.queue.splice(i,1);drawSheet();render();showToast('已從接下來移除一首。',true);return}
 if(a==='undo'&&state.removed){state.queue.splice(Math.max(state.index+1,state.removed.index),0,state.removed.id);state.removed=null;if(sheet.open)drawSheet();render();showToast('已放回接下來的曲目。');return}
 if(a==='tune-option'){state.tune=b.dataset.value;drawSheet();return}
 if(a==='apply-tune'){if(!state.tune.trim())return;const prefix=state.queue.slice(0,state.index+1),tail=state.queue.slice(state.index+1);if(tail.length>=2)[tail[0],tail[1]]=[tail[1],tail[0]];state.queue=[...prefix,...tail];closeSheet();render();showToast(tail.length>=2?'已交換接下來的示意曲目；這首沒有中斷。':'接下來的曲目不足，已保留目前節目。');return}
 if(a==='replay-intro'){closeSheet();state.phase='intro';state.introPosition=0;state.playing=true;startTimer();render();return}
 if(a==='dj'){state.dj=!state.dj;if(!state.dj&&state.phase==='intro'){state.phase='track';state.introPosition=0;}render();return}
 if(a==='length'){state.length=state.length==='short'?'standard':'short';render();return}
 if(a==='simulate'){if(!state.hasShow){state.hasShow=true;state.showSeed='原型情境預覽';state.queue=[0,1,2,3,4];state.index=0;state.phase='track';}state.playing=false;stopTimer();state.error=b.dataset.error;state.tab='listen';render(true);return}
 if(a==='recover'){state.error=null;state.playing=true;if(state.phase==='ready')state.phase='track';startTimer();render();showToast('已恢復示意狀態，沒有實際連線或音訊。');return}
 if(a==='reset'){stopTimer();state.generation++;clearInterval(generationTimer);state.tab='home';state.mode='feeling';state.page='idle';state.seed='';state.artist='';state.hasShow=false;state.playing=false;state.phase='ready';state.position=0;state.queue=[0,1,2,3,4];state.index=0;state.dj=true;state.error=null;state.tune='';state.liked.clear();render(true);showToast('示意原型已重設。');return}
});
if(window.visualViewport){const base=window.innerHeight;const onViewport=()=>document.body.classList.toggle('keyboard-open',base-window.visualViewport.height>150&&['TEXTAREA','INPUT'].includes(document.activeElement?.tagName));visualViewport.addEventListener('resize',onViewport);document.addEventListener('focusout',()=>setTimeout(()=>document.body.classList.remove('keyboard-open'),100))}
window.addEventListener('pagehide',stopTimer);
// No audio engine: resuming this prototype only resumes its explicitly labeled timer.
window.addEventListener('pageshow',()=>{if(state.playing)startTimer()});
render();
</script>
</body>
</html>
